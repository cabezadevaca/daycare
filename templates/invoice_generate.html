{% extends "base.html" %}
{% block title %}Generate Invoices — Daycare Admin{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('invoices_list') }}">Invoices</a></li>
        <li class="breadcrumb-item active">Generate</li>
    </ol>
</nav>

<h4 class="mb-4">Generate Invoices</h4>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="post" action="{{ url_for('invoice_generate') }}">
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Year</label>
                    <input type="number" name="year" class="form-control" value="{{ current_year }}" min="2020" max="2099">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Month</label>
                    <select name="month" class="form-select">
                        {% for m in range(1, 13) %}
                        <option value="{{ m }}" {% if m == current_month %}selected{% endif %}>{{ m }} — {{ ["January","February","March","April","May","June","July","August","September","October","November","December"][m-1] }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <h6 class="mb-3">Select Families</h6>
            <div class="mb-3">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="selectAll">
                    <label class="form-check-label fw-semibold" for="selectAll">Select All</label>
                </div>
                <hr>
                {% for fam in families %}
                <div class="form-check mb-2">
                    <input class="form-check-input family-check" type="checkbox" name="family_ids" value="{{ fam.id }}" id="fam{{ fam.id }}" checked>
                    <label class="form-check-label" for="fam{{ fam.id }}">
                        Family #{{ fam.id }}
                        — {{ fam.parents|map(attribute='name')|join(', ') if fam.parents else 'No parents' }}
                        ({{ fam.children|length }} child{{ 'ren' if fam.children|length != 1 else '' }})
                    </label>
                </div>
                {% else %}
                <p class="text-muted">No families available.</p>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary"><i class="bi bi-receipt"></i> Generate</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('selectAll').addEventListener('change', function() {
    document.querySelectorAll('.family-check').forEach(cb => cb.checked = this.checked);
});
</script>
{% endblock %}
