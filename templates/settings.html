{% extends "base.html" %}
{% block title %}Settings — Daycare Admin{% endblock %}
{% block content %}
<h4 class="mb-4">Daycare Settings</h4>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="post" action="{{ url_for('settings') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Daycare Name</label>
                    <input type="text" name="name" class="form-control" value="{{ daycare.name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">EIN</label>
                    <input type="text" name="ein" class="form-control" value="{{ daycare.ein or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" value="{{ daycare.address or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Town / State / Zip</label>
                    <input type="text" name="town_state_zip" class="form-control" value="{{ daycare.town_state_zip or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ daycare.phone or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ daycare.email or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Logo Path</label>
                    <input type="text" name="logo" class="form-control" value="{{ daycare.logo or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Invoice Prefix</label>
                    <input type="text" name="invoice_prefix" class="form-control" value="{{ daycare.invoice_prefix or '' }}">
                </div>

                <div class="col-12"><hr><h6>Email Sender Settings</h6></div>
                <div class="col-md-4">
                    <label class="form-label">Send Through</label>
                    <input type="text" name="sender_through" class="form-control" value="{{ daycare.sender_through or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sender Email</label>
                    <input type="email" name="sender_email" class="form-control" value="{{ daycare.sender_email or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sender Password</label>
                    <input type="password" name="sender_password" class="form-control" placeholder="(unchanged)">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
